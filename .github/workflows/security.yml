name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    name: Known dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix adapters/mcp
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix adapters/mcp
