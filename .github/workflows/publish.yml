name: Publish npm
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alvintayzhenwei/kanban-lite'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(name, '@alvintayzhenwei/kanban-lite');
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          if (process.env.RELEASE_EVENT === 'push') {
            assert.equal(process.env.RELEASE_TAG, `v${version}`);
          } else {
            assert.equal(process.env.RELEASE_EVENT, 'workflow_dispatch');
          }
          JS
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm supports trusted publishing
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'Trusted publishing requires npm >=11.5.1');
          JS
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix adapters/mcp
      - run: npm run check
      - run: npm run check:mcp
      - run: npm run test:plugins
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix adapters/mcp
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      - name: Preview release package
        run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance
