version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.71.0 requires TypeScript <6.1.0. Revisit with parser support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      development-minor-patch:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /adapters/mcp
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.71.0 requires TypeScript <6.1.0. Revisit with parser support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      adapter-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
